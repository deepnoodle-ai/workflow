name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # Risor v3 is not released yet, and its Go module cannot be fetched by
      # the go command. go.mod replaces it with ../risor/go, so put the
      # repository there at a pinned commit.
      - name: Risor v3, beside this checkout
        run: |
          git clone --quiet https://github.com/deepnoodle-ai/risor ../risor
          git -C ../risor checkout --quiet f246e32168177f663f6b3a0efb57e95e938f07ea

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # The engine runs no goroutines, so its package skips -race, except
      # for the one test that shares a host's schema across goroutines.
      - run: go test -count=1 ./...

      - run: go test -count=1 -race ./durable/... ./internal/... ./local/...

      - run: go test -count=1 -race -run TestHostSchemasAreNotMutated .

      - name: postgres module
        working-directory: postgres
        env:
          WORKFLOW_PG_DSN: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
        run: go vet ./... && go test -count=1 -race ./...

      - name: sqlite module (modernc.org/sqlite)
        working-directory: sqlite
        run: go vet ./... && go test -count=1 -race ./...

      - name: decisions module
        working-directory: decisions
        run: go vet ./... && go test -count=1 -race ./...

      - name: backend parity (both modules compile against one interface)
        working-directory: internal/parity
        run: go vet ./... && go test -count=1 ./...

  sqlite-mattn:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Risor v3 is not released yet, and its Go module cannot be fetched by
      # the go command. go.mod replaces it with ../risor/go, so put the
      # repository there at a pinned commit.
      - name: Risor v3, beside this checkout
        run: |
          git clone --quiet https://github.com/deepnoodle-ai/risor ../risor
          git -C ../risor checkout --quiet f246e32168177f663f6b3a0efb57e95e938f07ea

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: sqlite module (mattn/go-sqlite3, cgo)
        working-directory: sqlite
        run: go vet -tags sqlite_mattn ./... && go test -count=1 -race -tags sqlite_mattn ./...
